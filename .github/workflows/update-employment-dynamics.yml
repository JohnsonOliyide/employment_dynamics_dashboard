name: Update Employment Data

on:
  schedule:
    - cron: "25 19 * * 1-5"
  push:
    paths:
      - "scripts/**"
      - "requirements.txt"
      - ".github/workflows/**"
  workflow_dispatch:

concurrency:
  group: data-refresh
  cancel-in-progress: false

jobs:
  update-data:
    timeout-minutes: 20
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install packages
        run: |
          pip install requests pandas

      - name: Check refresh safeguards
        run: python -m unittest discover -s tests

      - name: Run update script
        run: |
          python scripts/update_employment_dynamics.py

      - name: Commit changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add data/*.csv

          git diff --staged --quiet || git commit -m "Automatic employment data update"

          git push
